# Deploy the static repository root directly, without a build step.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Require public organization website and workflow-based Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REPOSITORY" != "S2Tok/s2tok.github.io" ] ||
             [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" != "false" ] ||
             [ "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.public == true and .build_type == "workflow"')" != "true" ]; then
            echo "::error::Deployment requires the public S2Tok/s2tok.github.io repository and public, workflow-based Pages site."
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
